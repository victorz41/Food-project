<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge - Claim Dashboard Wireframe</title>
    <link rel="stylesheet" href="hungry.css">
    <!-- Leaflet Maps CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module" src="hungry.js" defer></script>
    
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">← Back to Main Wireframe</a>

        <div class="dashboard-layout">
            <!-- LEFT COLUMN: LIVE FEED LISTINGS -->
            <div class="wireframe-panel">
                <span class="section-label">Screen 1C: Browse & Claim Surplus Food</span>
                <h2>Available Surplus Food Nearby</h2>
                <div class="listing-feed" id="listing-feed"></div>
            </div>

            <!-- RIGHT COLUMN: GEOLOCATION MAP COMPONENT -->
            <div class="wireframe-panel">
                <span class="section-label">Pickup Location Map</span>
                <!-- Interactive Leaflet Map Div -->
                <div id="map" style="height: 550px; width: 100%; border-radius: 4px;"></div>
            </div>
        </div>
    </div>

</body>
</html>
